meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: python -m uvicorn web.main:app --host 0.0.0.0 --port 8000
  containerPort: 8000
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
