{% extends 'main.html' %}

{% block content %}
	<h3>Цвета филамента - {{producer}} - {{typefil}}</h3>
	<table bgcolor="#eeeeee">
 	<tr>
 		<th>Название</th>
 		<th>Hex</th>
 		<th>Изображение</th>
 	</tr>
 	{% for color in colors: %}
 	<tr>
 		<td><a href="{{ url_for('show_example', producer=producer, typefil=typefil, color=color.name) }}">{{ color.name }}</a></td>
 		<td>{{ color.hex }}</td>
 		<td><img src={{ color.image }} width="200" height="50" alt="Не прогрузилось("></td>
 	</tr>
 	{% endfor %}
 </table>
{% endblock %}
