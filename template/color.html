{% extends 'main.html' %}

{% block content %}
	<style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        img {
            max-width: 150px; /* Ограничиваем максимальную ширину картинки */
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
	<h3>Цвета филамента - {{producer}} - {{typefil}}</h3>
	<table bgcolor="#eeeeee">
 	<tr>
 		<th>Название</th>
 		<th>Hex</th>
 		<th>Изображение</th>
 	</tr>
 	{% for color in colors: %}
 	<tr>
 		<td><h4>
 			<a href="{{ url_for('show_example', producer=producer, typefil=typefil, color=color.name) }}">{{ color.name }}</a>
 		</h4></td>
 		<td>{{ color.hex }}</td>
 		<td><img src={{ color.image }} width="200" height="50" alt="Не прогрузилось("></td>
 	</tr>
 	{% endfor %}
 </table>
{% endblock %}
