<!DOCTYPE html>
<html lang="en">
<style>
	html * {
 		font-size: 20pt;
 		font-family: Courier, sans-serif;
	}
	body {
 		margin: 0 auto;
 		max-width: 1000px;
	}
	.container {
    	display: flex; /* Активирует Flexbox */
    	gap: 10px;    /* Расстояние между элементами */
  		}
  	.item {
    	width: 50%;
  		}
  	.user {
  		display: flex; /* Активирует Flexbox */
    	width: 50%;
    	margin-top: 10%;
  		}
  	table {
            width: 50%;
            border-collapse: collapse;
        }
    th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
    
</style>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="/static/script.js"></script> 
	<title>Примеры изделий из филамента (3d печать)</title>
</head>
<body>
	<div class="container">
  		<div class="item">
			<h3><a href="/">Главная страница</a></h3>
			<h3><a href="/filament">Филамент</a></h3>
  		</div>
  		<div class="item">
  			<div class="user" id="user">
  				<form  action="/user/login" id="login_form">
  					<button type="submit" id="button_login">Логин</button>
  				</form>
  				<form action="/user/registration" id="reg_form">
  					<button type="submit" id="button_reg">Регистрация</button>
  				</form>
  				<button type="submit" id="button_exit">Выйти</button>
    		</div>
    		<h1 id="message">{{message}}</h1>
  		</div>
	</div>
	

	<div class="body">
		{% block content %}
		{% endblock %}
	</div>

	<script>
		function LogOut(){
    		// Удаление access token из localStorage
			localStorage.removeItem('token');
			document.getElementById("message").innerHTML = "Вы вышли из профиля.";
			// перенаправление на главную страницу
			window.location.href = "/";
		}
		
		// назначаем функцию для выхода из аутентификации
		document.getElementById('button_exit').addEventListener('click', LogOut);

		// отправка токена на адрес
        async function getdata(){
            const data = await sendTokenMain();
        }
        getdata();


</script>
</body>
</html>
